type: vertical-stack
cards:
  - type: custom:button-card
    entity: media_player.panasonic_ub820
    name: "[[[ return entity.attributes.friendly_name ]]]"
    show_name: true
    show_icon: false
    show_state: true
    state_display: |
      [[[ 
        if (entity.attributes.detailed_status) {
          // Replace underscores with spaces (e.g. "TRAY_OPEN" -> "TRAY OPEN")
          return entity.attributes.detailed_status.replace(/_/g, " ");
        }
        return entity.state;
      ]]]
    styles:
      card:
        - background-color: "#121212"
        - border: "2px solid #2C2C2C"
        - border-bottom: none
        - border-top-left-radius: 24px
        - border-top-right-radius: 24px
        - border-bottom-left-radius: 0px
        - border-bottom-right-radius: 0px
        - padding: 15px 0px 5px 0px
        - box-shadow: 0 10px 30px rgba(0,0,0,0.8)
        - margin-bottom: "-10px"
      name:
        - color: "#555"
        - font-size: 10px
        - font-weight: bold
        - letter-spacing: 2px
        - text-transform: uppercase
        - margin-bottom: 5px
      state:
        - color: "#4CAF50"
        - font-family: monospace
        - font-size: 24px
        - font-weight: bold
        - text-transform: uppercase
        - text-shadow: 0 0 10px rgba(76, 175, 80, 0.5)
  - type: custom:universal-remote-card
    title: Panasonic UB820
    media_player_id: media_player.panasonic_ub820
    styles: >
      /* Main Card Background */

      ha-card {
        background-color: #121212 !important; /* Deep Black */
        border-radius: 0px 0px 24px 24px !important; /* Rounded bottom only */
        padding: 0px 20px 20px 20px !important;
        border: 2px solid #2C2C2C;
        border-top: none; /* Connect to top card */
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      }


      .row {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        margin-bottom: 12px;
      }


      /* Standard Buttons - High Contrast */

      remote-button {
        background-color: #CCCCCC;
        border-radius: 50%;
        border: 1px solid #444;
        transition: background-color 0.1s;
        /* Size adjustments */
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }


      /* Press Effect */

      remote-button:active {
        background-color: #505050 !important;
        transform: scale(0.92);
      }


      #circlepad::part(circlepad) {
        border: 5px solid #444;
        background: radial-gradient(circle at top left, #303030 100%, #202020 15%);
        --icon-color: rgba(128,128,128,0.5);
      }


      #center::part(button) {
        background: radial-gradient(circle at top left, #303030 100%, #101010 15%);
        border: 1px solid rgba(0, 0, 0, 0.5);
      }

      #center::part(icon) {
        color: rgba(128,128,128, 0.8);
        --size: 36px;
      }


      #power::part(icon) {
        color: #1B5E20;
      }


      #power_off::part(icon) {
        color: #B71C1C;
      }


      /* Color Buttons - Solid visible background with light icon */

      #red { background-color: #D32F2F; border-color: #B71C1C; color: white; }

      #green { background-color: #388E3C; border-color: #1B5E20; color: white; }

      #yellow { background-color: #FBC02D; border-color: #F57F17; color:
      #212121; }

      #blue { background-color: #1976D2; border-color: #0D47A1; color: white; }


      /* Branding */

      #netflix { color: #E50914; border-color: #E50914; }
    rows:
      - - power
        - eject
        - power_off
      - - pause
        - play
        - stop
      - - home
        - top_menu
        - popup_menu
        - info
      - - circlepad
      - - return
        - option
        - setup
        - clear
      - - skip_rev
        - scan_rev
        - scan_fwd
        - skip_fwd
      - - minus_10s
        - plus_60s
        - cc
      - - audio
        - subtitle
        - playback_info
      - - hdr
        - picture_setting
        - sound_effect
        - high_clarity
      - - netflix
        - internet
        - mirroring
      - - red
        - green
        - yellow
        - blue
      - - digit_1
        - digit_2
        - digit_3
      - - digit_4
        - digit_5
        - digit_6
      - - digit_7
        - digit_8
        - digit_9
      - - dot
        - digit_0
        - null
    custom_actions:
